<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#cdeeff" />
    <title>PDBOOK</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M3 7c5-2 9-1 13 2v19c-4-3-8-4-13-2z' fill='%23ff6b6b'/><path d='M29 7c-5-2-9-1-13 2v19c4-3 8-4 13-2z' fill='%234aa8ff'/></svg>" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path d="M3 7c5-2 9-1 13 2v19c-4-3-8-4-13-2z" fill="#ff6b6b" />
          <path d="M29 7c-5-2-9-1-13 2v19c4-3 8-4 13-2z" fill="#4aa8ff" />
          <path d="M16 9v19" stroke="#fff" stroke-width="1.6" />
        </svg>
        <span class="brand-word" aria-label="PDBOOK"><b>P</b><b>D</b><b>B</b><b>O</b><b>O</b><b>K</b></span>
      </div>
      <div class="doc-title" id="docTitle"></div>
      <div class="actions">
        <button class="icon-btn" id="libraryBtn" data-i18n-title="library" data-i18n-aria="backToLibrary" hidden>
          <svg viewBox="0 0 24 24"><path d="M5 4v16M9 4v16M13 5l4 15M19 20H4" /></svg>
        </button>
        <button class="icon-btn" id="openBtn" data-i18n-title="openPdf" data-i18n-aria="openPdfLabel">
          <svg viewBox="0 0 24 24"><path d="M4 20V6a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v2" /><path d="M4 20l3-8h15l-3 8z" /></svg>
        </button>
        <button class="icon-btn" id="fsBtn" data-i18n-title="fullscreen" data-i18n-aria="fullscreenLabel">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
        </button>
      </div>
    </header>

    <main id="stage">
      <section id="library">
        <div class="lib-inner">
          <header class="lib-head">
            <div>
              <h1 data-i18n="library">Library</h1>
              <p class="lib-sub">
                <span id="libCount"></span>
                <span class="native-only"> · <button class="link" id="libLocation" data-i18n-title="changeLocation"></button></span>
              </p>
            </div>
            <div class="lib-actions">
              <button class="ghost native-only" id="libReveal" data-i18n="showInFinder">Show in Finder</button>
              <button class="primary" id="libAdd">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
                <span data-i18n="addBooks">Add Books</span>
              </button>
            </div>
          </header>

          <div class="lib-message" id="libSetup" hidden>
            <div class="drop-art" aria-hidden="true">
              <div class="mini-book"><span></span><span></span><span></span></div>
            </div>
            <h2 data-i18n="setupTitle">Choose where to keep your books</h2>
            <p data-i18n="setupText"></p>
            <button class="primary" id="libChoose" data-i18n="setupButton">Choose Library Folder…</button>
          </div>

          <div class="shelf" id="shelf"></div>

          <div class="lib-message" id="libEmpty" hidden>
            <div class="drop-art" aria-hidden="true">
              <div class="mini-book"><span></span><span></span><span></span></div>
            </div>
            <h2 data-i18n="emptyTitle">Your library is empty</h2>
            <p data-i18n-html="emptyText"></p>
            <button class="link native-only" id="libRestore" data-i18n="restoreSamples">Restore the free sample books</button>
          </div>

          <p class="lib-note web-only" id="libNote"></p>
        </div>
      </section>

      <div id="bookArea" hidden>
        <div id="bookShift">
          <div id="bookBed"></div>
          <div id="bookHost"></div>
        </div>
      </div>

      <button class="nav-arrow prev" id="prevBtn" data-i18n-aria="previousPage" hidden>
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg>
      </button>
      <button class="nav-arrow next" id="nextBtn" data-i18n-aria="nextPage" hidden>
        <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" /></svg>
      </button>

      <div id="loading" hidden>
        <div class="loader"><span></span><span></span><span></span></div>
        <p id="loadingText"></p>
      </div>
    </main>

    <footer class="bottombar" id="bottombar" hidden>
      <input type="range" id="scrubber" min="0" max="0" value="0" data-i18n-aria="page" />
      <div class="indicator" id="indicator"></div>
    </footer>

    <div id="dropOverlay" hidden><div data-i18n="dropToOpen"></div></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden />

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
