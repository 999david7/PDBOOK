<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1815" />
    <title>PDBOOK</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M3 7c5-2 9-1 13 2 4-3 8-4 13-2v19c-5-2-9-1-13 2-4-3-8-4-13-2z' fill='%23d9a54f'/><path d='M16 9v19' stroke='%231b1815' stroke-width='1.5'/></svg>" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 7c5-2 9-1 13 2 4-3 8-4 13-2v19c-5-2-9-1-13 2-4-3-8-4-13-2z" /><path class="spine" d="M16 9v19" /></svg>
        <span>PDBOOK</span>
      </div>
      <div class="doc-title" id="docTitle"></div>
      <div class="actions">
        <button class="icon-btn" id="libraryBtn" title="Library" aria-label="Back to library" hidden>
          <svg viewBox="0 0 24 24"><path d="M5 4v16M9 4v16M13 5l4 15M19 20H4" /></svg>
        </button>
        <button class="icon-btn" id="openBtn" title="Open PDF (O)" aria-label="Open PDF">
          <svg viewBox="0 0 24 24"><path d="M4 20V6a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v2" /><path d="M4 20l3-8h15l-3 8z" /></svg>
        </button>
        <button class="icon-btn" id="fsBtn" title="Fullscreen (F)" aria-label="Toggle fullscreen">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
        </button>
      </div>
    </header>

    <main id="stage">
      <section id="library">
        <div class="lib-inner">
          <header class="lib-head">
            <div>
              <h1>Library</h1>
              <p class="lib-sub">
                <span id="libCount"></span>
                <span class="native-only"> · <button class="link" id="libLocation" title="Change library location…"></button></span>
              </p>
            </div>
            <div class="lib-actions">
              <button class="ghost native-only" id="libReveal">Show in Finder</button>
              <button class="primary" id="libAdd">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
                Add Books
              </button>
            </div>
          </header>

          <div class="lib-message" id="libSetup" hidden>
            <div class="drop-art" aria-hidden="true">
              <div class="mini-book"><span></span><span></span><span></span></div>
            </div>
            <h2>Choose where to keep your books</h2>
            <p>PDBOOK creates a “PDBOOK Library” folder there, with five free sample books to get you started.</p>
            <button class="primary" id="libChoose">Choose Library Folder…</button>
          </div>

          <div class="shelf" id="shelf"></div>

          <div class="lib-message" id="libEmpty" hidden>
            <div class="drop-art" aria-hidden="true">
              <div class="mini-book"><span></span><span></span><span></span></div>
            </div>
            <h2>Your library is empty</h2>
            <p>Add PDFs with <strong>Add Books</strong>, or drop them onto this window.</p>
            <button class="link native-only" id="libRestore">Restore the free sample books</button>
          </div>

          <p class="lib-note web-only" id="libNote"></p>
        </div>
      </section>

      <div id="bookArea" hidden>
        <div id="bookShift">
          <div id="bookBed"></div>
          <div id="bookHost"></div>
        </div>
      </div>

      <button class="nav-arrow prev" id="prevBtn" aria-label="Previous page" hidden>
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg>
      </button>
      <button class="nav-arrow next" id="nextBtn" aria-label="Next page" hidden>
        <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" /></svg>
      </button>

      <div id="loading" hidden>
        <div class="loader"><span></span><span></span><span></span></div>
        <p id="loadingText">Opening…</p>
      </div>
    </main>

    <footer class="bottombar" id="bottombar" hidden>
      <input type="range" id="scrubber" min="0" max="0" value="0" aria-label="Page" />
      <div class="indicator" id="indicator"></div>
    </footer>

    <div id="dropOverlay" hidden><div>Drop PDF to open</div></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden />

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
