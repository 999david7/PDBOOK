<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1815" />
    <title>PDBOOK</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M3 7c5-2 9-1 13 2 4-3 8-4 13-2v19c-5-2-9-1-13 2-4-3-8-4-13-2z' fill='%23d9a54f'/><path d='M16 9v19' stroke='%231b1815' stroke-width='1.5'/></svg>" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 7c5-2 9-1 13 2 4-3 8-4 13-2v19c-5-2-9-1-13 2-4-3-8-4-13-2z" /><path class="spine" d="M16 9v19" /></svg>
        <span>PDBOOK</span>
      </div>
      <div class="doc-title" id="docTitle"></div>
      <div class="actions">
        <button class="icon-btn" id="openBtn" title="Open PDF (O)" aria-label="Open PDF">
          <svg viewBox="0 0 24 24"><path d="M4 20V6a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v2" /><path d="M4 20l3-8h15l-3 8z" /></svg>
        </button>
        <button class="icon-btn" id="fsBtn" title="Fullscreen (F)" aria-label="Toggle fullscreen">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
        </button>
      </div>
    </header>

    <main id="stage">
      <section id="welcome">
        <div class="drop-card" id="dropCard">
          <div class="drop-art" aria-hidden="true">
            <div class="mini-book"><span></span><span></span><span></span></div>
          </div>
          <h1>Turn any PDF into a book</h1>
          <p>Drop a PDF here, or pick one. The cover is found automatically and the book resizes to fit your screen.</p>
          <div class="drop-actions">
            <button class="primary" id="chooseBtn">Choose PDF</button>
            <button class="ghost" id="sampleBtn">Try a sample</button>
          </div>
          <p class="hint">Swipe, drag a page corner, click the arrows, or use ← →</p>
        </div>
      </section>

      <div id="bookArea" hidden>
        <div id="bookShift">
          <div id="bookBed"></div>
          <div id="bookHost"></div>
        </div>
      </div>

      <button class="nav-arrow prev" id="prevBtn" aria-label="Previous page" hidden>
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg>
      </button>
      <button class="nav-arrow next" id="nextBtn" aria-label="Next page" hidden>
        <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" /></svg>
      </button>

      <div id="loading" hidden>
        <div class="loader"><span></span><span></span><span></span></div>
        <p id="loadingText">Opening…</p>
      </div>
    </main>

    <footer class="bottombar" id="bottombar" hidden>
      <input type="range" id="scrubber" min="0" max="0" value="0" aria-label="Page" />
      <div class="indicator" id="indicator"></div>
    </footer>

    <div id="dropOverlay" hidden><div>Drop PDF to open</div></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden />

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
